  }

        break;
    }

  window.applyAllEditableValues = window.applyAllEditableValues || applyAllEditableValues;
  window.sekaiApplyEditableValues = applyAllEditableValues;

    document.addEventListener('DOMContentLoaded', applyAllEditableValues);

  }

<script>/* Hollow Run loading screen: the game's own chase, played out while it arrives. The pumpkin witch runs

   load advances, until she reaches the jack-o'-lantern. Bats cross the moon, windows flicker, embers
   rise, the tips change, and a tap makes her jump. Same interface as the bar it replaces (show, hide, setTotal, setProgress,
   completePreInit, setInitialProgress), so the game keeps driving it with real progress. */
//#region @sekai:loading-scene · initialize animated loading presentation
function LoadingBar()
{
    var TIPS = window.REMIX.TEXT.tips;                      // words and candy colours: see the remix block
    var BAT = '<svg viewBox="0 0 48 24" aria-hidden="true"><path d="M24 9c2-4 4-4 5-1 5-6 12-6 19-2-5 0-8 2-9 6-3-2-6-2-8 1-2-2-4 1-7 8-3-7-5-10-7-8-2-3-5-3-8-1-1-4-4-6-9-6 7-4 14-4 19 2 1-3 3-3 5 1z"/></svg>';
    var GHOST = '<svg viewBox="0 0 40 46" aria-hidden="true"><path d="M20 2c10 0 16 8 16 18v22l-5-4-5 5-6-5-6 5-5-5-5 4V20C4 10 10 2 20 2z" fill="#fff6e9" stroke="#1b0e30" stroke-width="2"/><ellipse cx="14" cy="19" rx="3" ry="4.5" fill="#1b0e30"/><ellipse cx="26" cy="19" rx="3" ry="4.5" fill="#1b0e30"/><ellipse cx="20" cy="29" rx="3.5" ry="4.5" fill="#1b0e30"/></svg>';
    var PUMPKIN = '<svg viewBox="0 0 44 40" aria-hidden="true"><rect x="20" y="1" width="4" height="8" rx="1" fill="#4f6b1f"/><ellipse cx="13" cy="23" rx="11" ry="15" fill="#e2700f"/><ellipse cx="31" cy="23" rx="11" ry="15" fill="#e2700f"/><ellipse cx="22" cy="23" rx="12" ry="16" fill="#f58a1c"/><path d="M11 18l7-3-2 7zM33 18l-7-3 2 7zM10 26l5 3 4-3 3 3 3-3 4 3 5-3-4 8-5-2-3 2-3-2-5 2z" fill="#ffe873"/></svg>';
    var LIMB = '<path class="hr-sock" d="M0 0v15"/><path class="hr-stripe" d="M0 0v15"/>';
    var WITCH = '<svg viewBox="0 0 64 90" aria-hidden="true">'
        + '<g class="hr-leg hr-swing-b" transform="translate(29 62)">' + LIMB + '<ellipse cx="3" cy="17" rx="6" ry="3.4" fill="#3b2166"/></g>'
        + '<g class="hr-arm hr-swing-a" transform="translate(30 47)">' + LIMB + '<circle cy="16" r="3.6" fill="#9bdc4a"/></g>'
        + '<path d="M23 43h18l7 21-5-3-4 3-4-3-4 3-4-3-5 3z" fill="#6a36a8" stroke="#1b0e30" stroke-width="1.5" stroke-linejoin="round"/>'
        + '<path d="M19 61l5-3 4 3 4-3 4 3 4-3 5 3" fill="none" stroke="#f58a1c" stroke-width="2.4" stroke-linejoin="round"/>'
        + '<rect x="34" y="50" width="6" height="5" fill="#8c5bd0" stroke="#1b0e30" stroke-width=".8" stroke-dasharray="1.4 1"/>'
        + '<g class="hr-leg hr-swing-a" transform="translate(35 62)">' + LIMB + '<ellipse cx="3" cy="17" rx="6" ry="3.4" fill="#4b2a7a"/></g>'
        + '<g class="hr-head"><circle cx="32" cy="32" r="13.5" fill="#f58a1c" stroke="#1b0e30" stroke-width="1.5"/>'
        + '<path d="M29 19c-6 7-6 19 0 26M36 19c6 7 6 19 0 26" fill="none" stroke="#d9600a" stroke-width="1.4"/>'
        + '<path class="hr-face" d="M35 28l7-3-1 7zM27 29l5-2v5zM27 37l3 2 3-2 3 2 5-3-2 7-4-2-3 2-3-2z" fill="#ffe873"/>'
        + '<path d="M19 24Q23 6 9 2q25-3 36 19z" fill="#3b2166" stroke="#1b0e30" stroke-width="1.5" stroke-linejoin="round"/>'
        + '<path d="M20 19q12-6 23-1l2 3q-13-4-26 3z" fill="#f58a1c"/>'
        + '<ellipse cx="32" cy="23.5" rx="20" ry="4.4" transform="rotate(-5 32 23.5)" fill="#4b2a7a" stroke="#1b0e30" stroke-width="1.5"/></g>'
        + '<g class="hr-arm hr-swing-b" transform="translate(34 47)">' + LIMB + '<circle cy="16" r="3.6" fill="#b4ee5c"/></g>'
        + '</svg>';
    var CANDY_COLOURS = window.REMIX.COLOURS.loadingCandy;
    var RUN_FROM = 0.12, RUN_SPAN = 0.8;   // the runner's share of the track, so the ghost behind her stays on screen
    var SCENE = '<svg class="hr-ground" viewBox="0 0 800 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">'
        + '<path d="M0 210c120-60 230-70 330-30 90-50 220-60 470 30v90H0z" fill="#1c0f33"/>'
        + '<g fill="#0a0514"><path d="M560 190v-70l-12 0 42-46 42 46-12 0v70z"/><path d="M604 96v-34h12v46z"/>'
        + '<path d="M150 232c-4-40 2-70 0-104-14-8-24-22-30-40 14 10 22 16 30 18-2-18-10-30-22-40 18 4 26 14 30 26 6-22 16-34 34-40-10 12-16 26-18 46 10-8 20-12 34-12-12 8-22 18-32 34 0 40-4 76 2 112z"/>'
        + '<path d="M0 232c160-34 330-40 800 0v68H0z"/>'
        + '<path d="M250 236v-34a14 14 0 0 1 28 0v34zM330 240v-26h-8v-8h8v-10h8v10h8v8h-8v26zM420 238v-30a12 12 0 0 1 24 0v30zM690 232v-36a15 15 0 0 1 30 0v36z"/>'
        + '<path d="M20 240v-34l5-8 5 8v34zM46 240v-34l5-8 5 8v34zM72 240v-34l5-8 5 8v34zM98 240v-34l5-8 5 8v34zM14 216h100v5H14z"/></g>'
        + '<g class="hr-windows" fill="#ffb347"><rect x="572" y="140" width="12" height="16"/><rect x="598" y="140" width="12" height="16"/><rect x="585" y="108" width="10" height="12"/></g>'
        + '</svg>';

    var showing = false;
    var preInitActive = true;
    var preInitStartedAt = 0;
    var preInitFrame = 0;
    var tipTimer = 0;
    var tipIndex = Math.floor(Math.random() * TIPS.length);

    var container = document.createElement('div');
    container.className = 'hr-loading';
    // Loading art: the address is in the remix block (REMIX.ASSETS). If the picture cannot load, the
    // drawn night scene comes back.
    // // sekai-slot: images:loading_art desc="Picture behind the loading bar"
    var artUrl = window.getConfig('images', 'loading_art', (window.REMIX && window.REMIX.ASSETS || {})['assets/preload/loading-art.webp']);
    if (artUrl)

        container.classList.add('hr-art');
        container.style.setProperty('--hr-art', 'url("' + String(artUrl).replace(/"/g, '%22') + '")');
        var artProbe = new Image();
        artProbe.onerror = function () { container.classList.remove('hr-art'); };
        artProbe.src = artUrl;
    }
    container.setAttribute('role', 'progressbar');
    container.setAttribute('aria-label', window.REMIX.TEXT.loading);
    var stars = '';
    for (var i = 0; i < 46; i++)
    {
        // Fixed pseudo-random scatter so the sky is the same on every visit.
        var x = (i * 61.8) % 100, y = (i * 37.3) % 62, size = 1 + (i % 3);
        stars += '<i style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%;width:' + size + 'px;height:' + size + 'px;animation-delay:' + ((i * 0.37) % 4).toFixed(2) + 's"></i>';
    }
    var candies = '', embers = '';
    for (var c = 0; c < CANDY_COLOURS.length; c++)
    {
        candies += '<u style="left:' + (20 + c * 62.5 / Math.max(1, CANDY_COLOURS.length - 1)) + '%;background:' + CANDY_COLOURS[c] + '"></u>';
    }
    for (var e = 0; e < 9; e++)
    {
        embers += '<i style="left:' + ((e * 23.7 + 9) % 100).toFixed(1) + '%;animation-delay:-' + (e * 1.3).toFixed(1) + 's;animation-duration:' + (7 + (e % 4) * 1.5) + 's"></i>';
    }
    container.innerHTML = '<div class="hr-stars">' + stars + '</div><div class="hr-moon"></div>'
        + '<div class="hr-bat hr-bat-a">' + BAT + '</div><div class="hr-bat hr-bat-b">' + BAT + '</div><div class="hr-bat hr-bat-c">' + BAT + '</div>'
        + '<div class="hr-land">' + SCENE + SCENE + '</div><div class="hr-fog"></div><div class="hr-embers">' + embers + '</div>'
        + '<div class="hr-load"><div class="hr-logo-box"><div class="hr-logo-text">HOLLOW<br>RUN</div><img class="hr-logo" alt="" src="assets/preload/splash.webp"></div>'
        + '<div class="hr-track"><div class="hr-rail"><i></i></div><div class="hr-candies">' + candies + '</div>'
        + '<div class="hr-runner"><div class="hr-ghost">' + GHOST + '</div><div class="hr-hero">' + WITCH + '</div></div>'
        + '<div class="hr-goal">' + PUMPKIN + '</div></div>'
        + '<b></b><span></span></div>';
    container.insertAdjacentHTML('beforeend', '<img class="hr-art-image" data-sekai-slot="images:loading_art" alt="">');
    var artImage = container.querySelector('.hr-art-image');
    artImage.addEventListener('error', function () { container.classList.remove('hr-art'); });
    //#region @sekai:loading-input · handle loading interactions and copy
    var bar = container.querySelector('.hr-rail i');
    var runner = container.querySelector('.hr-runner');
    var hero = container.querySelector('.hr-hero');
    var treats = container.querySelectorAll('.hr-candies u');
    // A tap makes her jump: something to do while the game arrives.
    container.addEventListener('pointerdown', function () { hero.classList.add('hr-jump'); });
    hero.addEventListener('animationend', function (event) { if (event.animationName === 'hr-jump') hero.classList.remove('hr-jump'); });
    var label = container.querySelector('.hr-load b');
    var tip = container.querySelector('.hr-load span');
    var logo = container.querySelector('.hr-logo');
    var logoText = container.querySelector('.hr-logo-text');
    logo.style.visibility = 'hidden';
    logo.onload = function () { logo.style.visibility = ''; logoText.style.visibility = 'hidden'; };

    function nextTip()
    {
        tipIndex = (tipIndex + 1) % TIPS.length;
        tip.classList.remove('on');
        setTimeout(function () { tip.textContent = TIPS[tipIndex]; tip.classList.add('on'); }, 260);
    }

    //#endregion @sekai:loading-input
    function show()
    {
        if (showing) return;
        showing = true;
        container.classList.remove('hr-leaving');
        document.body.appendChild(container);
        document.documentElement.classList.add('hr-is-loading');
        tip.textContent = TIPS[tipIndex];
        tip.classList.add('on');
        tipTimer = setInterval(nextTip, 3200);
        setProgress(0);

        if (preInitActive)
        {
            preInitStartedAt = performance.now();
            preInitFrame = requestAnimationFrame(updatePreInitProgress);
        }
    }

    // anything is drawn. The screen stays until the scene has actually rendered (remix.js sets
    // __hollowReady after a few frames), with a time limit so a failed start can still show its message.
    var HOLD_LIMIT_MS = 8000;
    var holdTimer = 0;
    function hide()

        if (!showing || holdTimer) return;
        var asked = performance.now();

            if (!window.__hollowReady && performance.now() - asked < HOLD_LIMIT_MS) return;

            holdTimer = 0;
            leave();

    }

    function leave()

        document.documentElement.classList.remove('hr-is-loading');
        // Fade out over the game instead of cutting to it.
        container.classList.add('hr-leaving');
        setTimeout(function () { if (!showing) container.remove(); }, 450);
    }

    //#region @sekai:loading-progress · update and animate loading progress
    function renderProgress(ratio)
    {
        if (ratio < 0) ratio = 0;
        if (ratio > 1) ratio = 1;
        var percent = Math.round(ratio * 100);

        var at = RUN_FROM + ratio * RUN_SPAN;
        bar.style.transform = 'scaleX(' + at + ')';
        runner.style.left = (at * 100) + '%';
        for (var i = 0; i < treats.length; i++) treats[i].classList.toggle('got', parseFloat(treats[i].style.left) <= at * 100);
        label.textContent = percent + '%';
        container.setAttribute('aria-valuenow', percent);
    }

    // Before the game code has arrived there is nothing to measure, so the bar eases towards the halfway mark.
    function updatePreInitProgress(now)
    {
        if (!showing || !preInitActive) return;
        renderProgress(0.49 * (1 - Math.exp(-(now - preInitStartedAt) / 1600)));
        preInitFrame = requestAnimationFrame(updatePreInitProgress);
    }

    function completePreInit()
    {
        if (!preInitActive) return;
        preInitActive = false;
        cancelAnimationFrame(preInitFrame);
        renderProgress(0.5);
    }

    function setInitialProgress(ratio)
    {
        completePreInit();
        if (ratio < 0) ratio = 0;
        if (ratio > 1) ratio = 1;
        renderProgress(0.5 + (ratio * 0.5));
    }

    function setProgress(ratio)
    {
        renderProgress(ratio);
    }
    //#endregion @sekai:loading-progress

    show();
    this.show = show;
    this.hide = hide;
    this.setTotal = function () {};
    this.setProgress = setProgress;
    this.completePreInit = completePreInit;
    this.setInitialProgress = setInitialProgress;
}
//#endregion @sekai:loading-scene

window.loadingBar = new LoadingBar();
</script>

          const loading=document.querySelector('.hr-loading');if(loading)loading.setAttribute('aria-label',dictionary[lang].loading);

    <script id="source-viewer-code">
    //#region @sekai:source-viewer · source code display and copy modal
    (()=>{
      let cachedSource='';
      try{fetch(window.location.href).then(r=>r.ok?r.text():'').then(t=>{if(t&&t.includes('<html'))cachedSource=t;}).catch(()=>{});}catch(e){}
      let toastTimer=0;
      function showToast(msg){
        const toast=document.getElementById('source-toast');
        if(!toast)return;
        toast.textContent=msg;toast.hidden=false;toast.classList.add('show');
        clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.classList.remove('show');toast.hidden=true;},2200);
      }
      async function openSourceViewer(){
        if(!cachedSource){try{const res=await fetch(window.location.href);if(res.ok){const text=await res.text();if(text&&text.includes('<html'))cachedSource=text;}}catch(e){}}
        const code=cachedSource||('<!DOCTYPE html>\n'+document.documentElement.outerHTML);
        const codeEl=document.querySelector('#source-code-pre code');if(codeEl)codeEl.textContent=code;
        const modal=document.getElementById('source-viewer');if(modal)modal.hidden=false;
      }
      function closeSourceViewer(){const modal=document.getElementById('source-viewer');if(modal)modal.hidden=true;}
      async function copySourceCode(){
        const codeEl=document.querySelector('#source-code-pre code');
        const code=codeEl?.textContent||cachedSource||('<!DOCTYPE html>\n'+document.documentElement.outerHTML);
        let copied=false;
        if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(code);copied=true;}catch(e){}}
        if(!copied){try{const ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.opacity='0';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();copied=document.execCommand('copy');document.body.removeChild(ta);}catch(e){}}
        if(copied){
          const toastMsg=document.getElementById('source-toast')?.dataset?.msg||'已複製完整原始碼至剪貼簿';
          showToast(toastMsg);
          const copyBtn=document.getElementById('source-copy-btn');
          if(copyBtn){const orig=copyBtn.textContent;copyBtn.textContent='✓ '+(copyBtn.dataset.copiedText||'已複製！');setTimeout(()=>{copyBtn.textContent=orig;},2000);}
        }
      }
      function init(){
        const toggle=document.getElementById('source-toggle');
        const closeBtn=document.getElementById('source-close-btn');
        const copyBtn=document.getElementById('source-copy-btn');
        if(toggle)toggle.addEventListener('click',openSourceViewer);
        if(closeBtn)closeBtn.addEventListener('click',closeSourceViewer);
        if(copyBtn)copyBtn.addEventListener('click',copySourceCode);
        window.addEventListener('keydown',e=>{if(e.key==='Escape'){const modal=document.getElementById('source-viewer');if(modal&&!modal.hidden)closeSourceViewer();}});
      }
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
    })();
    //#endregion @sekai:source-viewer
    </script>
